[project]
name = "watchparty-backend"
version = "0.1.0"
description = "Backend services and Lambda handlers for Watch Party"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aws-lambda-powertools[all]>=3.5.0",
    "boto3>=1.37.0",
    "livekit-api>=0.8.0",
    "pydantic>=2.10.0",
    "pyjwt>=2.10.0",
]

[dependency-groups]
dev = [
    "moto[dynamodb]>=5.0.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/handlers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
