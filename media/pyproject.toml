[project]
name = "media-scripts"
version = "0.1.0"
description = "Offline HLS publishing tools for the catalog (ffmpeg -> S3 -> DynamoDB)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.37.0",
]

[dependency-groups]
dev = [
    "moto[dynamodb,s3]>=5.0.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
