line-length = 100
target-version = "py314"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[lint.per-file-ignores]
"tests/*" = ["ARG"]
"src/handlers/*" = ["ARG001"]

[lint.isort]
known-first-party = ["core", "handlers"]

[format]
quote-style = "double"
indent-style = "space"
