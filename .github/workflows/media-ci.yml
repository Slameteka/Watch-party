name: Media CI

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "media/**"
      - ".github/workflows/media-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "media/**"
      - ".github/workflows/media-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Media Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check formatting (ruff format)
        run: uv run ruff format --check

      - name: Lint code (ruff check)
        run: uv run ruff check

      - name: Run unit tests (pytest)
        run: uv run pytest -v

      - name: Validate catalog.json
        run: uv run python -c "import publish_media as pm; print(sorted(pm.load_catalog(pm.DEFAULT_CATALOG)))"
        env:
          PYTHONPATH: scripts
